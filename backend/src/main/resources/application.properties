spring.application.name=zincy-backend

server.port=${PORT:8081}

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Prevent database access after the service layer has completed.
spring.jpa.open-in-view=false

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Do not expose internal exception details through API responses.
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# MSG91
msg91.authkey=${MSG91_AUTHKEY:}
msg91.templateId=${MSG91_TEMPLATE_ID:}
