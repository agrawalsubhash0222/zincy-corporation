spring.application.name=zincy-backend

server.port=${PORT:8081}

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Prevent database access after the service layer has completed.
spring.jpa.open-in-view=false

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Do not expose internal exception details through API responses.
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# MSG91
msg91.authkey=${MSG91_AUTHKEY:}
msg91.templateId=${MSG91_TEMPLATE_ID:}


# WhatsApp Cloud API
whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v25.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:zincy_login_otp}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}

# WhatsApp OTP security
whatsapp.otp.expiry-minutes=5
whatsapp.otp.max-verification-attempts=5
whatsapp.otp.resend-cooldown-seconds=60
