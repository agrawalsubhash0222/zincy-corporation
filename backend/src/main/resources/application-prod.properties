# Production database configuration must be supplied by the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Temporary until Flyway or Liquibase migrations are introduced.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production logging
logging.level.root=WARN
logging.level.com.zincycorporation=INFO

# Production frontend origin
app.frontend-url=${FRONTEND_URL}

# Correctly process proxy headers from Nginx.
server.forward-headers-strategy=framework

# Never expose health details publicly.
management.endpoint.health.show-details=never

# zincycorp.in is HTTPS.
app.session.secure=true
app.security.require-trusted-origin=true
