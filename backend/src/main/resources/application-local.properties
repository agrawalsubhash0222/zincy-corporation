# Local MySQL database
#
# The hostname "mysql" works when the backend runs inside
# docker-compose.local.yml.
#
# DB_URL can override this when Spring Boot runs directly on Windows.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/zincy_corporation_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Local database behaviour
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local logging
logging.level.root=INFO
logging.level.com.zincycorporation=DEBUG

# Local frontend origins used by CORS
app.frontend-url=${FRONTEND_URL:http://localhost:8084}
