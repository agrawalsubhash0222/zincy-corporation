# Local MySQL database
#
# The hostname "mysql" works when the backend runs inside
# docker-compose.local.yml.
#
# DB_URL can override this when Spring Boot runs directly on Windows.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/zincy_corporation_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Local database behaviour
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local logging
logging.level.root=INFO
logging.level.com.zincycorporation=DEBUG

# Local frontend origins used by CORS
app.frontend-url=${FRONTEND_URL:http://localhost:8084}

# Local HTTP cannot use a Secure cookie.
app.session.secure=false

# Disabled locally so Expo native and command-line testing remain convenient.
app.security.require-trusted-origin=false

# Local payment testing. Keep gateways disabled until test credentials are
# present in .env.local.
payment.frontend-base-url=${PAYMENT_FRONTEND_BASE_URL:http://localhost:8084}
phonepe.oauth-url=${PHONEPE_OAUTH_URL:https://api-preprod.phonepe.com/apis/pg-sandbox/v1/oauth/token}
phonepe.api-base-url=${PHONEPE_API_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}
