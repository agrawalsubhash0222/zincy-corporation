# Dev database configuration must be supplied by the Dev environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Dev uses its own isolated schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dev logging
logging.level.root=INFO
logging.level.com.zincycorporation=INFO

# Dev frontend origin
app.frontend-url=${FRONTEND_URL}

# Correctly process proxy headers from Nginx.
server.forward-headers-strategy=framework

# Do not expose health details publicly.
management.endpoint.health.show-details=never
