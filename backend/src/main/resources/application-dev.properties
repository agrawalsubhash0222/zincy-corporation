# Dev database configuration must be supplied by the Dev environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Dev uses its own isolated schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dev logging
logging.level.root=INFO
logging.level.com.zincycorporation=INFO

# Dev frontend origin
app.frontend-url=${FRONTEND_URL}

# Correctly process proxy headers from Nginx.
server.forward-headers-strategy=framework

# Do not expose health details publicly.
management.endpoint.health.show-details=never

# dev.zincycorp.in is HTTPS.
app.session.secure=true
app.security.require-trusted-origin=true

# Dev uses gateway test credentials and sandbox endpoints.
payment.frontend-base-url=${PAYMENT_FRONTEND_BASE_URL:https://dev.zincycorp.in}
phonepe.oauth-url=${PHONEPE_OAUTH_URL:https://api-preprod.phonepe.com/apis/pg-sandbox/v1/oauth/token}
phonepe.api-base-url=${PHONEPE_API_BASE_URL:https://api-preprod.phonepe.com/apis/pg-sandbox}
